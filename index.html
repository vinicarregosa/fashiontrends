<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Trends - Produtos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel ="stylesheet" href= "style.css">
    <script src="script.js" defer ></script>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
        <img class="sidebar__logo" src="assets/logo-4-fashiontrends.png" 
        alt="FashionTrends">

        <nav class="sidebar__nav" aria-label="Menu Principal">
            <ul>   
                <li>
                    <a href="#" class="nav__link nav__link--ativo"> Produtos</a>
                </li>
            </ul>
        </nav>
    </aside>

    <div class="conteudo">
        <header class="topbar">
            <button type="button" class="topbar__menu" 
            aria-label="Abrir menu">☰ </button>

            <div class="topbar__usuario">
                <span class="topbar__nome"> Bianca </span>
                <span class="topbar__cargo"> Analista de catálogo </span>
            </div>

        </header>

        <main class="principal">
            <section id="tela-lista" aria-labelledby="titulo-lista">
                <h1 id="titulo-lista">Produtos</h1>
                <p>A lista de produtos vai aparecer aqui.</p>
            </section>

            <section id="tela-formulario" aria-labelledby="titulo-formulario" hidden>
                <h1 id="titulo-formulario">Novo produto</h1>
                <p>O formulário vai aparecer aqui.</p>
            </section>

        </main>
    </div>
    </div>

</body>
</html>
